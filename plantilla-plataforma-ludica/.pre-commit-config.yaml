# Verificaciones que se ejecutan antes de cada commit.
# Se activan con: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check
        language: system
        types: [python]
      - id: pytest
        name: Pruebas
        entry: python -c "import os, sys, pytest; os.chdir('plantilla-plataforma-ludica'); sys.exit(pytest.main(['-q']))"
        language: system
        pass_filenames: false
        always_run: true
